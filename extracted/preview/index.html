    const x = pad + (index / (vals.length - 1)) * (w - 2 * pad);
    const y = pad + (1 - (value - min) / range) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}"/></svg>`;
}

// ?Ä?Ä detail prefetch helper ?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä
function prefetchDetail(href) {
  if (!href || prefetchedDetails.has(href)) return;

  prefetchedDetails.add(href);
  const link = document.createElement('link');
  link.rel = 'prefetch';
  link.href = href;
  link.as = 'document';
  document.head.appendChild(link);
}

// ?Ä?Ä row renderer ?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä
function createRow(etf) {
  const monthSeries = recentMonthSeries(etf);
  const pct = pricePct(etf);
  const pctStr = pct == null ? '' : `${pct > 0 ? '+' : ''}${pct.toFixed(1)}%`;
  const pctCls = pctClassName(pct);
  const row = rowTemplate.content.firstElementChild.cloneNode(true);
  const href = `./etf.html?code=${etf.code}`;

  row.href = href;
  row.querySelector('.er-code').textContent = etf.code;
  row.querySelector('.er-issuer').textContent = etf.issuer || '';
  row.querySelector('.er-name').textContent = etf.name;
  row.querySelector('.er-aum-v').textContent = fmtAum(etf.total_av_yi);
  row.querySelector('.er-spark-svg').innerHTML = renderSpark(monthSeries);

  const pctEl = row.querySelector('.er-pct');
  pctEl.textContent = pctStr;
  pctEl.className = `er-pct ${pctCls}`;
  pctEl.hidden = !pctStr;

  row.querySelector('.er-date').textContent = fmt(etf.listing_date);
  row.addEventListener('pointerenter', () => prefetchDetail(href), { once: true });
  row.addEventListener('focus', () => prefetchDetail(href), { once: true });

  return row;
}

function render(sortKey) {
  const sorters = {
    aum: (a, b) => (b.total_av_yi || 0) - (a.total_av_yi || 0) || a.code.localeCompare(b.code),
    code: (a, b) => a.code.localeCompare(b.code),
    listing: (a, b) => dateKey(b.listing_date).localeCompare(dateKey(a.listing_date)) || a.code.localeCompare(b.code),
    price_chg: (a, b) => {
      const pa = pricePct(a);
      const pb = pricePct(b);
      if (pa == null && pb == null) return a.code.localeCompare(b.code);
      if (pa == null) return 1;
      if (pb == null) return -1;
      return pb - pa || a.code.localeCompare(b.code);
    },
  };
  const sorted = [...etfs].sort(sorters[sortKey] || sorters.aum);

  list.innerHTML = '';
  if (!sorted.length) {
    list.innerHTML = '<div class="empty">Â∞öÁÑ°Ë≥áÊ?</div>';
    return;
  }

  for (const etf of sorted) list.appendChild(createRow(etf));
}
